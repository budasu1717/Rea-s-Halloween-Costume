<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reagan's Halloween Costume Wheel</title>
<style>
  :root { --gold:#ffd45a; --purple:#210c35; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; overflow:hidden;
    display:flex; justify-content:center; align-items:center;
    background:
      radial-gradient(circle at 50% 15%, #6b237f 0, #321047 32%, #140820 78%);
    color:white; font-family:Arial, Helvetica, sans-serif;
  }
  body:before {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.25;
    background-image:
      radial-gradient(circle, #fff 0 1px, transparent 2px),
      radial-gradient(circle, #ffbf3f 0 1px, transparent 2px);
    background-size:70px 70px, 110px 110px;
    background-position:10px 20px, 35px 55px;
  }
  .app { width:min(96vw,760px); text-align:center; padding:12px; }
  h1 {
    margin:0 0 2px; font-size:clamp(27px,7vw,52px); line-height:1.05;
    text-shadow:0 4px 12px #000; letter-spacing:.3px;
  }
  .sub { margin:6px 0 10px; font-size:clamp(14px,3.5vw,19px); opacity:.9; }
  .wheelArea {
    position:relative; width:min(92vw,650px); aspect-ratio:1;
    margin:0 auto; cursor:pointer; touch-action:manipulation;
  }
  canvas {
    width:100%; height:100%; display:block;
    filter:drop-shadow(0 13px 25px rgba(0,0,0,.55));
  }
  .pointer {
    position:absolute; z-index:4; top:-3px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:52px solid #ffd43f;
    filter:drop-shadow(0 3px 3px #000);
  }
  .tap {
    margin:8px 0 0; font-weight:900; font-size:clamp(17px,4vw,24px);
    text-shadow:0 2px 5px #000;
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse { 50% { transform:scale(1.04); opacity:.72; } }
  .result {
    min-height:38px; margin-top:6px; font-size:clamp(21px,5vw,34px);
    font-weight:900; text-shadow:0 3px 8px #000;
  }
  .result.win { animation:pop .65s ease; }
  @keyframes pop {
    0%{transform:scale(.6);opacity:0} 65%{transform:scale(1.18)}
    100%{transform:scale(1);opacity:1}
  }
  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20; }
  .piece {
    position:absolute; width:9px; height:15px; top:-20px;
    animation:fall linear forwards;
  }
  @keyframes fall {
    to { transform:translate3d(var(--x),110vh,0) rotate(720deg); }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎃 Reagan's Halloween Wheel 🎃</h1>
  <div class="sub">Tap the wheel and let Halloween decide!</div>

  <div class="wheelArea" id="wheelArea" aria-label="Tap to spin the costume wheel">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800"></canvas>
  </div>

  <div class="tap" id="tap">✨ TAP THE WHEEL TO SPIN! ✨</div>
  <div class="result" id="result">What will Reagan be?!</div>
</div>
<div class="confetti" id="confetti"></div>

<script>
const options = [
  {name:"Shimmer & Shine", color:"#f39acb", icon:"✨"},
  {name:"Bluey", color:"#68b8ee", icon:"🐾"},
  {name:"Disney Princess", color:"#b990e8", icon:"👑"},
  {name:"Race Car Drivers", color:"#ed3a30", icon:"🏁"},
  {name:"Oz — Elphaba & Glinda", color:"#9fdb67", icon:"🧙"},
  {name:"Halloween Wild Card", color:"#ff9f37", icon:"🎃"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const area=document.getElementById("wheelArea");
const result=document.getElementById("result");
const tap=document.getElementById("tap");
const confetti=document.getElementById("confetti");
let rotation=0, spinning=false;

function wrapText(text,max=17){
  const words=text.split(" "), lines=[]; let line="";
  for(const word of words){
    const test=(line+" "+word).trim();
    if(test.length>max && line){ lines.push(line); line=word; }
    else line=test;
  }
  if(line) lines.push(line);
  return lines;
}

function draw(){
  const cx=400,cy=400,r=365,n=options.length,slice=Math.PI*2/n;
  ctx.clearRect(0,0,800,800);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotation);

  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*slice, a1=a0+slice;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,a0,a1); ctx.closePath();
    ctx.fillStyle=options[i].color; ctx.fill();
    ctx.lineWidth=8; ctx.strokeStyle="#ffe36b"; ctx.stroke();

    ctx.save();
    ctx.rotate(a0+slice/2);
    ctx.translate(r*.62,0);
    ctx.rotate(Math.PI/2);
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#fff";
    ctx.font="bold 34px Arial";
    ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=4;
    ctx.fillText(options[i].icon,0,-45);
    ctx.font="900 25px Arial";
    const lines=wrapText(options[i].name);
    lines.forEach((line,j)=>ctx.fillText(line,0,(j-(lines.length-1)/2)*29+4));
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(0,0,78,0,Math.PI*2);
  ctx.fillStyle="#f5b82d"; ctx.fill();
  ctx.lineWidth=9; ctx.strokeStyle="#fff0a5"; ctx.stroke();
  ctx.fillStyle="#fff"; ctx.font="bold 44px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("★",0,2);
  ctx.restore();

  ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2);
  ctx.lineWidth=22; ctx.strokeStyle="#f6b72e"; ctx.stroke();

  // little bulbs
  for(let i=0;i<30;i++){
    const a=i*Math.PI*2/30;
    const x=cx+(r+5)*Math.cos(a), y=cy+(r+5)*Math.sin(a);
    ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle="#fff6b0"; ctx.fill();
  }
}
draw();

function celebrate(){
  confetti.innerHTML="";
  const pieces=90;
  for(let i=0;i<pieces;i++){
    const p=document.createElement("div");
    p.className="piece";
    p.style.left=(Math.random()*100)+"vw";
    p.style.background=["#ff4d8d","#ffd43f","#70d6ff","#9fdb67","#b990e8","#fff"][Math.floor(Math.random()*6)];
    p.style.setProperty("--x",(Math.random()*300-150)+"px");
    p.style.animationDuration=(1.7+Math.random()*2.2)+"s";
    p.style.animationDelay=(Math.random()*.35)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    confetti.appendChild(p);
  }
  setTimeout(()=>confetti.innerHTML="",4500);
}

function spin(){
  if(spinning) return;
  spinning=true;
  tap.textContent="🎃 SPINNING... 🎃";
  result.textContent="";

  const n=options.length, slice=360/n;
  const chosen=Math.floor(Math.random()*n);

  // The pointer is at the top. Aim the chosen slice's center there.
  const target=360-(chosen*slice+slice/2);
  const current=((rotation*180/Math.PI)%360+360)%360;
  const delta=360*6+((target-current+360)%360);
  const start=rotation, end=rotation+delta*Math.PI/180;
  const duration=4300, t0=performance.now();

  function frame(now){
    const t=Math.min(1,(now-t0)/duration);
    const eased=1-Math.pow(1-t,4);
    rotation=start+(end-start)*eased;
    draw();
    if(t<1) requestAnimationFrame(frame);
    else{
      spinning=false;
      tap.textContent="✨ TAP THE WHEEL TO SPIN AGAIN! ✨";
      result.textContent="🎉 "+options[chosen].name+"! 🎉";
      result.classList.remove("win"); void result.offsetWidth; result.classList.add("win");
      celebrate();
    }
  }
  requestAnimationFrame(frame);
}
area.addEventListener("click",spin);
area.addEventListener("touchend",(e)=>{e.preventDefault(); spin();},{passive:false});
</script>
</body>
</html>
